name: build-exe

# Builds the real Windows .exe with PyInstaller and smoke-tests it:
#   dist/RobloxVPN.exe  - tray VPN client (no console, no Python needed)
# Also builds the Stealth engine (stealth-wg.exe, Go) and bundles it +
# wintun.dll into the PyInstaller bundle.

on:
  push:
    paths:
      - 'client/**'
      - 'stealth/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install build deps
        run: pip install pyinstaller -r client/requirements.txt

      - name: Build Stealth engine (Go, windows/amd64)
        run: |
          cd stealth
          go build -o dist/stealth-wg.exe .
          curl -sL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          7z e wintun.zip -odist wintun/bin/amd64/wintun.dll -r
          dir dist

      - name: Build exe (bundle Stealth engine + wintun)
        run: pyinstaller --noconfirm --onefile --noconsole --name RobloxVPN --add-binary "stealth/dist/stealth-wg.exe;." --add-binary "stealth/dist/wintun.dll;." client/roblox_vpn.py

      - name: Smoke-test exe (built-in self-test, no admin needed)
        run: dist\RobloxVPN.exe --self-test

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/RobloxVPN.exe
